<script id="MAYA_COMMAND_CENTER_V21">
(function(){
  function install(){
    if(document.getElementById('maya-command-center-link-v21')) return;
    var url=location.protocol+'//'+location.hostname+':8065/';
    var all=[].slice.call(document.querySelectorAll('a,button'));
    var ref=all.find(function(el){return (el.textContent||'').toUpperCase().indexOf('STORAGE NETWORK')>=0;}) ||
            all.find(function(el){return (el.textContent||'').toUpperCase().indexOf('MINIFARMA')>=0;}) ||
            all.find(function(el){return (el.textContent||'').toUpperCase().indexOf('SERVER MONITOR')>=0;});
    if(ref){
      var base=ref.closest('a')||ref;
      if(base.tagName==='A'){
        var a=base.cloneNode(true); a.id='maya-command-center-link-v21'; a.href=url; a.target='_self';
        var textNode=[].slice.call(a.querySelectorAll('*')).reverse().find(function(x){var t=(x.textContent||'').trim();return t && t.length<80;});
        if(textNode) textNode.textContent='MAYA COMMAND CENTER â†—'; else a.textContent='MAYA COMMAND CENTER â†—';
        base.parentElement.appendChild(a); return;
      }
    }
    var a=document.createElement('a'); a.id='maya-command-center-link-v21'; a.href=url; a.textContent='âœ¦  MAYA COMMAND CENTER';
    a.style.cssText='position:fixed;right:18px;bottom:18px;z-index:2147483647;padding:14px 18px;border:1px solid #5bc7ff;border-radius:14px;background:linear-gradient(135deg,#0b315d,#402d83);color:white;text-decoration:none;font:800 12px Segoe UI,Arial;letter-spacing:.08em;box-shadow:0 12px 40px #000b';
    document.body.appendChild(a);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install); else install();
  setTimeout(install,1200);
})();
</script>
